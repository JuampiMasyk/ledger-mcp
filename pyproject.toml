[project]
name = "ledger-mcp"
version = "0.1.0"
description = "MCP server that lets LLM agents query and reconcile an accounts-payable ledger, with a golden-set eval suite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Juan Pablo Masyk" }]
dependencies = ["mcp[cli]>=1.20,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
ledger-mcp = "ledger_mcp.server:main"
ledger-seed = "ledger_mcp.seed:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["N801"]
